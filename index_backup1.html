<!DOCTYPE html>
<html lang="nb"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Taekwondo-quiz</title>
<style>
:root{--bg:#eceff3;--ink:#14202b;--card:#fff;--line:#c9d1d9;--ok:#1f8a4c;--bad:#c0392b;--band:#14202b;font-family:ui-rounded,"Avenir Next","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}
#band{height:18px;background:var(--band);transition:background .3s}
main{max-width:820px;margin:0 auto;padding:24px 20px 96px}
h1{font-size:2.2rem;margin:0 0 6px}
p.sub{margin:0 0 22px;font-size:1.15rem;line-height:1.4}
.belt{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:68px;margin:0 0 10px;padding:0 22px;border:2px solid var(--ink);border-radius:10px;font:inherit;font-size:1.3rem;font-weight:700;cursor:pointer}
.belt small{font-weight:500;font-size:1rem;opacity:.85}
.belt.sel{outline:5px solid #cd2e3a;outline-offset:2px}
label.opt{display:flex;gap:12px;align-items:center;margin:18px 0;font-size:1.1rem}
label.opt input{width:26px;height:26px}
button.main{min-height:64px;padding:0 34px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-size:1.3rem;font-weight:700;cursor:pointer}
button.ghost{min-height:52px;padding:0 22px;border:2px solid var(--ink);border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:1.05rem}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
#q{font-size:1.9rem;line-height:1.3;margin:0 0 26px;font-weight:700}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ans{min-height:92px;padding:12px 18px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:1.3rem;font-weight:600;cursor:pointer}
.ans.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ans.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.ans:disabled{cursor:default}
#fb{min-height:44px;margin:22px 0 10px;font-size:1.3rem;font-weight:700}
.score{font-size:3rem;font-weight:800;margin:10px 0}
ul.miss{padding-left:22px;line-height:1.6;font-size:1.1rem}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
#flag{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;min-height:38px;padding:0 14px;border-width:1.5px;border-radius:19px;background:var(--card);font-size:.85rem;font-weight:500}
#flagbox{position:fixed;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:10;width:min(360px,calc(100vw - 32px));padding:16px;border:2px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#flagbox .row{margin-top:12px}
#flagbox label{display:block;margin-bottom:8px;font-weight:700;font-size:1.05rem}
#flagbox textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:1.1rem;resize:vertical}
@media(max-width:560px){.answers{grid-template-columns:1fr}#q{font-size:1.5rem}}
</style></head><body>
<div id="band"></div>
<main>
 <section id="home">
  <h1>Taekwondo-quiz</h1>
  <p class="sub">Velg beltet ditt. Du får bare spørsmål fra ditt belte og lavere.</p>
  <div id="belts"></div>
  <label class="opt"><input type="checkbox" id="only"> Bare spørsmål fra mitt eget belte</label>
  <button class="main" id="go">Start quiz</button>
 </section>
 <section id="quiz" hidden>
  <div class="top"><span id="prog"></span><button class="ghost" id="quit">Avslutt</button></div>
  <div class="bar"><i id="barfill"></i></div>
  <p id="q"></p>
  <div class="answers" id="answers"></div>
  <div id="fb"></div>
  <div class="row"><button class="main" id="next" hidden>Neste</button></div>
  <button class="ghost" id="flag">⚑ Meld fra om feil</button>
  <div id="flagbox" hidden>
   <label for="note">Hva er feil? (valgfritt)</label>
   <textarea id="note" rows="2" maxlength="300" placeholder="F.eks. skrivefeil, eller for vanskelig for dette beltet"></textarea>
   <div class="row"><button class="main" id="sendflag">Send</button><button class="ghost" id="cancelflag">Avbryt</button></div>
  </div>
 </section>
 <section id="result" hidden>
  <h1 id="rtitle"></h1>
  <div class="score" id="rscore"></div>
  <div id="rmiss"></div>
  <div class="row"><button class="main" id="again">Ny runde</button><button class="ghost" id="change">Bytt belte</button></div>
 </section>
</main>
<script src="sporsmal.js"></script>
<script>
/* ===== Quiz-motor (innholdet ligger i sporsmal.js) ===== */
if(typeof VOCAB==="undefined"){document.body.innerHTML="<main><h1>Fant ikke sporsmal.js</h1><p>Legg filen sporsmal.js i samme mappe som index.html.</p></main>";throw new Error("sporsmal.js mangler")}
const POOL=[];
VOCAB.forEach(([k,n,l,c])=>{
 POOL.push({k:k,l:l,cat:"a"+c,dir:"a",q:"Hva betyr «"+k+"»?",a:n});
 POOL.push({k:k,l:l,cat:"b"+c,dir:"b",q:c==="tall"?"Hva heter tallet "+n+" på koreansk?":"Hva heter «"+n+"» på koreansk?",a:k});
});
FACTS.forEach(([l,q,a,w])=>POOL.push({k:q,l:l,cat:"f",dir:"f",q:q,a:a,w:w}));

const $=id=>document.getElementById(id);
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let belt=Math.min(6,Math.max(1,+ls("belt")||1)),only=ls("only")==="1",round=[],i=0,score=0,missed=[],locked=false;

function show(id){["home","quiz","result"].forEach(s=>$(s).hidden=s!==id)}
function paintBelt(){document.documentElement.style.setProperty("--band",BELTS[belt-1].c);
 [...$("belts").children].forEach((b,x)=>b.classList.toggle("sel",x===belt-1))}
function avail(l){return POOL.filter(p=>only?p.l===l:p.l<=l).length}

function buildHome(){
 BELTS.forEach((b,x)=>{const el=document.createElement("button");el.className="belt";
  el.style.background=b.c;el.style.color=b.t;
  el.innerHTML="<span></span><small></small>";el.firstChild.textContent=b.n;
  el.lastChild.textContent=avail(x+1)+" spørsmål";
  el.onclick=()=>{belt=x+1;ls("belt",belt);paintBelt()};$("belts").appendChild(el)});
 $("only").checked=only;paintBelt();
}
$("only").onchange=e=>{only=e.target.checked;ls("only",only?"1":"0");[...$("belts").children].forEach((b,x)=>b.lastChild.textContent=avail(x+1)+" spørsmål")};

function options(it){
 let ds=[];
 if(it.w)ds=it.w.slice();
 else{
  ds=shuffle([...new Set(POOL.filter(p=>p.cat===it.cat&&p.l<=belt&&p.a!==it.a).map(p=>p.a))]);
  if(ds.length<3)ds=ds.concat(shuffle([...new Set(POOL.filter(p=>p.dir===it.dir&&p.l<=belt&&p.a!==it.a).map(p=>p.a))]).filter(x=>!ds.includes(x)));
 }
 return shuffle([it.a].concat(ds.slice(0,3)));
}

function start(){
 const used=new Set();round=[];
 for(const p of shuffle(POOL.filter(p=>only?p.l===belt:p.l<=belt))){
  if(used.has(p.k))continue;used.add(p.k);round.push(p);if(round.length===10)break}
 i=0;score=0;missed=[];show("quiz");ask();
}
function ask(){
 const it=round[i];locked=false;
 $("prog").textContent="Spørsmål "+(i+1)+" av "+round.length+" · "+score+" riktige";
 $("barfill").style.width=(i/round.length*100)+"%";
 $("flag").disabled=false;$("flag").textContent="⚑ Meld fra om feil";$("flagbox").hidden=true;$("note").value="";
 $("q").textContent=it.q;$("fb").textContent="";$("next").hidden=true;
 const box=$("answers");box.innerHTML="";
 options(it).forEach(o=>{const b=document.createElement("button");b.className="ans";b.textContent=o;
  b.onclick=()=>pick(b,o,it);box.appendChild(b)});
}
function pick(btn,o,it){
 if(locked)return;locked=true;
 const right=o===it.a;
 if(right){score++;btn.classList.add("ok");$("fb").textContent="Riktig!"}
 else{btn.classList.add("bad");missed.push(it);
  [...$("answers").children].forEach(b=>{if(b.textContent===it.a)b.classList.add("ok")});
  $("fb").textContent="Det riktige svaret er: "+it.a}
 [...$("answers").children].forEach(b=>b.disabled=true);
 $("next").textContent=i+1>=round.length?"Se resultat":"Neste";$("next").hidden=false;
 $("prog").textContent="Spørsmål "+(i+1)+" av "+round.length+" · "+score+" riktige";
}
$("flag").onclick=()=>{$("flagbox").hidden=false;$("note").focus()};
$("cancelflag").onclick=()=>{$("flagbox").hidden=true;$("note").value=""};
$("sendflag").onclick=async()=>{
 const b=$("flag"),it=round[i],s=$("sendflag");s.disabled=true;
 try{const r=await fetch("flag",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:it.k,on:true,note:$("note").value})});
  if(!r.ok)throw 0;b.disabled=true;b.textContent="⚑ Merket – takk!";$("flagbox").hidden=true;$("note").value=""}
 catch(e){b.textContent="Kunne ikke melde fra (kjører serveren?)"}
 s.disabled=false;
};
$("next").onclick=()=>{i++;if(i>=round.length)finish();else ask()};
function finish(){
 show("result");
 const pct=score/round.length;
 $("rtitle").textContent=pct===1?"Perfekt! Kihap!":pct>=.7?"Flott jobbet!":"Bra innsats – øv litt mer!";
 $("rscore").textContent=score+" av "+round.length;
 const m=$("rmiss");m.innerHTML="";
 if(missed.length){const h=document.createElement("h3");h.textContent="Dette bør du øve på:";m.appendChild(h);
  const ul=document.createElement("ul");ul.className="miss";
  missed.forEach(it=>{const li=document.createElement("li");li.textContent=it.q+" → "+it.a;ul.appendChild(li)});m.appendChild(ul)}
}
$("go").onclick=start;$("again").onclick=start;
$("quit").onclick=()=>show("home");$("change").onclick=()=>show("home");
buildHome();
</script></body></html>
